version: powerfarm.registry-v0.working-4
status: adopted
date: 2026-09-26
supersedes: powerfarm.registry-v0.working-3

recognition:
  authority: director_merge
  baseline_pull_request: 13
  baseline_commit: 9efd916399a7f5511734c9476f64fd4615d73879
  amended_by_pull_request: 15

architecture:
  research:
    id: powerfarm.app/sector/research
    question: what-we-study
  continuity:
    id: powerfarm.app/sector/continuity
    question: how-we-do-it
  identity:
    id: powerfarm.app/sector/identity
    question: who-we-are
    functions:
      - oauth-and-principals
      - registry
      - minivault

principles:
  registry_is_structural_recognition_not_operational_omniscience: true
  operational_state_belongs_to_its_owner: true
  contracts_define_admissible_structure: true
  valuable_results_may_be_promoted_to_minivault: true
  projections_are_not_authority: true
  storage_does_not_define_semantics: true
  provider_identity_does_not_define_institutional_identity: true
  secret_values_in_public_or_projected_state: forbidden
  entities_are_governed_by_contracts: true
  types_come_from_current_contracts: true
  authority_is_computed_from_current_contracts_at_request_time: true
  identity_is_the_entity_login_is_a_binding: true
  migration_creates_no_rows: true
  first_write_is_the_foundation_act: true
  all_writes_through_the_institutional_api: true
  operational_state_outside_the_identity_substrate: true
  one_name_is_identity_address_and_link: true
  legacy_state_is_not_archived: true
  the_registry_is_born_from_the_story_not_migrated: true

names:
  specification: v0/V0-07_NAMES_AND_ADDRESSES.md
  thing: powerfarm.app/<type>/<name>
  contract: powerfarm.app/contract/<name>
  version_suffix: "@<version>"
  service: <service>.powerfarm.app
  bytes: sha256:<hex>
  type_segment: name-of-the-contract-that-defines-the-type
  stored_without_scheme: true
  resolvable_with_https_prefix: true
  lowercase_ascii: true
  never_reused: true
  never_renamed: true
  names_say_what_not_where: true
  provider_identities_are_bindings: true
  first_person_name: chosen-at-foundation-not-in-public-docs

hostnames:
  first_party_only: true
  webauthn_relying_party_id: powerfarm.app
  previews: <service>-preview.powerfarm.app
  services:
    - host: powerfarm.app
      role: front-door-and-name-resolver
      entity: powerfarm.app/service/registry
      stage: v0
    - host: id.powerfarm.app
      role: identity-login-oauth-issuer
      entity: powerfarm.app/service/identity
      stage: v0
    - host: api.powerfarm.app
      role: institutional-api
      entity: powerfarm.app/service/api
      stage: v0
    - host: vault.powerfarm.app
      role: minivault-web-projection
      entity: powerfarm.app/app/minivault-web
      stage: v0
    - host: places.powerfarm.app
      role: coloured-places
      entity: powerfarm.app/app/coloured-places
      stage: v0
    - host: mcp.powerfarm.app
      role: mcp-door
      entity: powerfarm.app/service/mcp
      stage: later-closed-until-supabase-oauth-fix
    - host: search.powerfarm.app
      role: search
      entity: powerfarm.app/service/search
      stage: later

bootstrap:
  first_two_contracts:
    - name: Contract Type
      type: self
    - name: Entity Type
      type: Contract Type
  contract_types:
    - Artifact Type
    - Action Type
    - Office
    - Mandate
    - app-contract
    - engine-capability
    - store-authority
    - search-contract
    - host-runner
    - machine-placement
    - secret-consumer
    - execution-approval
    - backup-custody
  entity_types:
    person: powerfarm.app/person/*
    agent: powerfarm.app/agent/*
    office: powerfarm.app/office/*
    sector: powerfarm.app/sector/<sector>
    machine: powerfarm.app/machine/*
    service: powerfarm.app/service/<service>
    host-runner: powerfarm.app/host-runner/*
    process: powerfarm.app/process/*
    app: powerfarm.app/app/*
    engine: powerfarm.app/engine/*
    mcp: powerfarm.app/mcp/*
    store: powerfarm.app/store/*
    repository: powerfarm.app/repository/*
    secret: powerfarm.app/secret/*
    search-source: powerfarm.app/search-source/*
    projection: powerfarm.app/projection/*
  artifact_types:
    - document
    - software
    - schema
    - dataset
    - prompt
    - capability
    - execution-bundle
    - migration-evidence
  action_types:
    - view
    - converse
    - approve
    - admit-person
    - recognize-contract
    - inscribe-entity
    - grant
    - store-content
    - read-content
    - write-observation
  mandate_prerogative:
    holder_types:
      - person
      - agent

foundation_act:
  runs: once
  precondition: registry-empty
  after: closed-forever
  recognizes:
    - first_two_contracts
    - contract_types
    - entity_type.person
    - entity_type.office
    - director_action_types
    - powerfarm.app/office/director
    - first_person
    - mandate.director.first_person
    - admission.first_person
  first_person_id_and_login: chosen-at-foundation-not-in-public-docs

required:
  offices:
    - id: powerfarm.app/office/director
      type: office
      eligible_holder_types:
        - person
    - id: powerfarm.app/office/engineer
      type: office
      eligible_holder_types:
        - agent
      autonomy_matrix:
        rungs:
          - OBSERVE
          - SUGGEST
          - SAFE-AUTO
          - POLICY-AUTO
        per_operation_class: true
        earned_by: precedent-indexed-by-input
        regressible: true
        authority_survives_autonomy: true
        evidence_authored_by_subject: false
        protected_classes_gated_at_every_rung: true
        initial_rung: OBSERVE-or-SUGGEST
        precedent_ledger: agent-runtime-events-in-powerfarm.app/store/antenna

  references:
    - id: the-book
      provider: supabase
      provider_ref: vbgzdqdlarulpfsyjrke
      provider_name: Google ADK mapping
      kind: acquired-reference-work
      disposition: KEEP
      existence_decided_by_powerfarm: false
      access: read-only
      use_as_backend: false
      ddl_allowed: false
      verified: 2026-09-26 16 schemas ~186 tables

  persons:
    - role: holder-of-powerfarm.app/office/director
      id: chosen-at-foundation
      mandate: powerfarm.app/contract/mandate.director.<holder>

  agents:
    - id: powerfarm.app/agent/lab-8gb
      place: powerfarm.app/machine/lab-8gb
      required: true
    - id: powerfarm.app/agent/lab-512
      place: powerfarm.app/machine/lab-512
      required: true
    - id: powerfarm.app/agent/lab-256
      place: powerfarm.app/machine/lab-256
      required: false

  machines:
    - id: powerfarm.app/machine/lab-8gb
      kind: machine
      expected_availability: always-on
    - id: powerfarm.app/machine/lab-512
      kind: machine
      expected_availability: always-on

  excluded_machines:
    - id: powerfarm.app/machine/lab-256
      reason: director-personal-mobile-computer
      may_be_required_for_ecosystem_availability: false

  continuity:
    workflow_engine:
      implementation: google-adk
      role: onboarding-and-workflow-orchestration
      placement: engine-park
      current_state: positive-delta

    host_runners:
      - id: powerfarm.app/host-runner/lab-8gb
        place: powerfarm.app/machine/lab-8gb
      - id: powerfarm.app/host-runner/lab-512
        place: powerfarm.app/machine/lab-512

    parks:
      app_park:
        admission: contract-required
        required_residents: []
      engine_park:
        admission: contract-required
        required_residents:
          - google-adk
    places:
      id: powerfarm.app/app/coloured-places
      placement: vercel
      vercel_project: powerfarm-places
      hostname: places.powerfarm.app
      repository: powerfarm/places
      role: projection

    permanent_processes:
      - id: powerfarm.app/process/manhattan
        places:
          - powerfarm.app/machine/lab-8gb
          - powerfarm.app/machine/lab-512
        cleanup_protected: true

    research:
      filesystem_root: ~/POWERFARM/Research
      observability: braintrust

    cloudkit:
      id: powerfarm.app/store/apps
      rebuild_allowed: true
      remote_programmatic_provisioning_required: true
      private_zone_provisioning_requires_user_authenticated_owner: true
      server_to_server_key_private_database_authority: false
      provisioner_placement: always-on-ecosystem-lab
      must_not_depend_on: powerfarm.app/machine/lab-256
      preserve_provider_capability:
        - apple-developer-account-binding
        - container-identity
        - provisioning-and-signing-material
        - required-keys-and-certificates
      target: iCloud.app.powerfarm
      role: contract-provisioned-app-and-engine-database-substrate
      owner_scope: admitted-apps-and-engines
      locator_policy: container/environment/database/zone
      institutional_registry_authority: false
      forbidden_final_state:
        - legacy-powerfarm-registry-test-records

  identity:
    supabase:
      id: powerfarm.app/store/company
      role: identity-substrate
      target: supabase
      provider_binding:
        project_ref: ekjlmclhqnsstfjzuabz
        project_name: powerfarm.kernal
        region: eu-west-1
        observed_state: ACTIVE_HEALTHY
        observed_at: 2026-09-23
      intended_for:
        - oauth-and-principals
        - institutional-registry
        - content-store
        - minivault
        - identity-supporting-state
        - institutional-api

    content_store:
      id: powerfarm.app/store/content
      substrate: supabase-storage-private-bucket
      within: powerfarm.app/store/company
      byte_digest: sha256
      manifests: true
      digest_is_capability: false

    minivault_hashes:
      semantic_identity: blake3
      exact_bytes: sha256


    minivault_interface:
      id: powerfarm.app/app/minivault-web
      kind: web-app
      audiences:
        - llm
        - human
      authority: false

    repositories:
      native_semantics_home: identity-minivault
      github_role:
        - source-control
        - collaboration
        - publication
        - projection
      github_defines_native_format: false

  operational:
    antenna_store:
      id: powerfarm.app/store/antenna
      owner: powerfarm.app/service/antenna
      provider: neon
      provisioned_through: vercel-integration
      role: observational-evidence
      writers: agents-own-observations-only
      registry_projection: read-only-refreshed-through-registry-api
      views:
        - existence-by-recognition
        - duties-by-facts

  services:
    - id: powerfarm.app/service/antenna
      kind: service
    - id: powerfarm.app/service/heartime
      kind: service
    - id: powerfarm.app/service/search
      kind: service

  search:
    authority: false
    sources:
      - id: powerfarm.app/search-source/company
        source: powerfarm.app/store/company
      - id: powerfarm.app/search-source/apps
        source: powerfarm.app/store/apps
    human_projection:
      id: powerfarm.app/projection/airtable
      role: powerfarm-search-frontend
      authoritative: false

  canonical_documents:
    - id: powerfarm.app/document/pf-01
      path: PF-01_Powerfarm_Charter.md
    - id: powerfarm.app/document/pf-02
      path: PF-02_Research_and_Evidence_Standard.md
    - id: powerfarm.app/document/pf-03
      path: PF-03_Powerfarm_Operating_System.md
    - id: powerfarm.app/document/pf-04
      path: PF-04_Intelligence_and_Technology_System.md
    - id: powerfarm.app/document/pf-05
      path: PF-05_Products_and_Business_System.md
    - id: powerfarm.app/document/pf-06
      path: PF-06_Standard_Documents_Catalog.md

  v0_specifications:
    - path: v0/V0-00_DELTA_AND_PLAN.md
    - path: v0/V0-01_DATA_REGISTRY_IDENTITY_AND_STORES.md
    - path: v0/V0-02_APP_PARK_ENGINE_PARK_AND_APP_CONTRACTS.md
    - path: v0/V0-06_POWERFARM_SEARCH.md
    - path: v0/V0-07_NAMES_AND_ADDRESSES.md

required_contract_families:
  - app-contract
  - engine-capability
  - store-authority
  - search-contract
  - host-runner
  - machine-placement
  - secret-consumer
  - execution-approval
  - backup-custody

legacy_sources:
  - id: legacy.supabase.kernal-registry-2026-09-24
    kind: unauthorized-bootstrap
    location: powerfarm.kernal schema powerfarm_registry
    terminal_disposition: DELETE
    archive: none
    method: renamed-out-of-the-way-and-closed-by-the-rebuild-script-then-dropped-by-director
    final_deletion_by: director
    id_mapping:
      pf.person.director: powerfarm.app/office/director (office) + first person (mandate)
      pf.host-runner.lab-8gb (used by agent): powerfarm.app/agent/lab-8gb
      pf.host-runner.lab-512 (used by agent): powerfarm.app/agent/lab-512

  - id: legacy.supabase.kernal-observation-2026-09-26
    kind: test-state
    location: powerfarm.kernal schema powerfarm_observacao
    terminal_disposition: DELETE
    archive: none
    method: renamed-out-of-the-way-and-closed-by-the-rebuild-script-then-dropped-by-director
    final_deletion_by: director
    replacement: powerfarm.app/store/antenna

  - id: legacy.airtable.registry-export
    kind: legacy-export
    location: minivault bucket
    terminal_disposition: DELETE
    archive: none
    with: legacy.supabase.kernal-registry-2026-09-24
    final_deletion_by: director

  - id: legacy.airtable.registry
    kind: migration-source
    terminal_disposition: DELETE
    after: verified-migration-to-supabase-identity

  - id: legacy.cloudkit.registry-tests
    kind: test-state
    terminal_disposition: DELETE
    after: signed-census-and-director-disposal-decision

  - id: legacy.supabase.powerfarm-registry
    kind: migration-source
    provider_name: powerfarm-registry
    live_provider_project_visible: false
    local_source: ~/lab/powerfarm-registry
    terminal_disposition: REPLACE
    replacement: powerfarm.app/store/company
    final_authority: false
    migrates: nothing
    registry_born_from: foundation-act-and-the-story

negative_delta_dispositions:
  - DELETE
  - ARCHIVE_THEN_MOVE
  - KEEP_OUTSIDE_REGISTRY
  - QUARANTINE_OR_DECIDE
  - REPLACE

repository_territories:
  active:
    provider: github
    organization: powerfarm
    meaning: active-v0-source-projection
    repositories:
      - .github
      - powerfarm-research-docs
      - powerfarm-specs
      - powerfarm-identity
      - powerfarm-continuity
      - places
      - minivault
      - powerfarm-antenna
      - powerfarm-heartime
  historical:
    provider: github
    organization: powercitty
    meaning: superseded-repository-preservation
    transfer_disposition: ARCHIVE_THEN_MOVE
    active_registry_membership_after_transfer: false
    move_from_powerfarm:
      - powerfarm-process-manager
      - powerfarm-platform
      - powerfarm-cli

current_negative_delta:
  lab8_app_park:
    replace:
      - coloured-places: vercel-projection
    delete:
      - cockpit
      - work-graph
      - zelador
      - zelador-grid
  lab512_app_park:
    delete:
      - zelador
  lab8_engine_park:
    delete:
      - powerfarm
      - workflow-engine
    add:
      - google-adk

secret_references:
  coloured_places:
    - supabase-publishable-key
    - oauth-client-id
    - oauth-client-secret
    - antenna-client-token-file
  research:
    - braintrust
    - google
  identity:
    - supabase
  apple_provisioner:
    - apple
  manhattan:
    - MANHATTAN_HOST
  agents:
    - antenna-store-credential-per-agent
    - chat-signing-key-per-agent
    - ai-gateway

unresolved_before_adoption: []

open_decisions:
  - login-methods-per-person
  - large-bytes-location
  - initial-rung-per-engineer-operation-class
  - off-machine-backup-destination

decided_2026_09_26:
  the_book: KEEP
  offices: director-is-the-owner; llm-agents-hold-engineer
  director_powers_v0: all, protected-effects-gated-by-approval
  who_admits_people: director
  registry_in_antenna_store: api-refreshed-projection-not-replication
  antenna_store_cost: accepted-at-researched-price

completion:
  negative_delta: empty_or_explicitly_retained
  positive_delta: empty
  legacy_cloudkit_registry_test_state: deleted
  legacy_airtable_registry_state: deleted
  legacy_supabase_registry_authority: absent
  current_registry_equals_adopted_ideal: true
  post_convergence_census_matches_topology: true
