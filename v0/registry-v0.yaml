# Powerfarm V0 target, machine-readable. Mirrors V0-00 … V0-07; the documents win on any difference.
version: powerfarm.registry-v0.working-5
status: adopted
date: 2026-09-26
recognition:
  authority: director_merge

documents:
  canon:
    - name: powerfarm.app/document/pf-01
      path: PF-01_Powerfarm_Charter.md
    - name: powerfarm.app/document/pf-02
      path: PF-02_Research_and_Evidence_Standard.md
    - name: powerfarm.app/document/pf-03
      path: PF-03_Powerfarm_Operating_System.md
    - name: powerfarm.app/document/pf-04
      path: PF-04_Intelligence_and_Technology_System.md
    - name: powerfarm.app/document/pf-05
      path: PF-05_Products_and_Business_System.md
    - name: powerfarm.app/document/pf-06
      path: PF-06_Standard_Documents_Catalog.md
  v0:
    - v0/V0-00_DELTA_AND_PLAN.md
    - v0/V0-01_DATA_REGISTRY_IDENTITY_AND_STORES.md
    - v0/V0-02_APP_PARK_ENGINE_PARK_AND_APP_CONTRACTS.md
    - v0/V0-03_REBUILD.md
    - v0/V0-06_POWERFARM_SEARCH.md
    - v0/V0-07_NAMES_AND_ADDRESSES.md

architecture:
  research:
    name: powerfarm.app/sector/research
    question: what-we-study
  continuity:
    name: powerfarm.app/sector/continuity
    question: how-we-do-it
  identity:
    name: powerfarm.app/sector/identity
    question: who-we-are
    functions:
      - oauth-and-principals
      - registry
      - minivault

principles:
  everything_institutional_is_rebuildable: true
  institutional_things_are_born_through_acts_never_by_seed: true
  registry_is_structural_recognition_not_operational_omniscience: true
  operational_state_belongs_to_its_owner: true
  contracts_define_admissible_structure: true
  types_come_from_current_contracts: true
  entities_are_governed_by_contracts: true
  authority_is_computed_from_current_contracts_at_request_time: true
  identity_is_the_entity_login_is_a_binding: true
  one_name_is_identity_address_and_link: true
  one_fingerprint: sha256
  migration_creates_no_rows: true
  first_act_is_the_foundation_act: true
  all_writes_through_the_institutional_api: true
  every_write_is_an_act_in_the_act_log: true
  projections_are_not_authority: true
  storage_does_not_define_semantics: true
  provider_identity_does_not_define_institutional_identity: true
  secret_values_in_public_or_projected_state: forbidden
  heartbeats_are_deterministic_never_a_model: true

names:
  specification: v0/V0-07_NAMES_AND_ADDRESSES.md
  thing: powerfarm.app/<type>/<name>
  contract: powerfarm.app/contract/<name>
  version_suffix: "@<version>"
  service: <service>.powerfarm.app
  bytes: sha256:<hex>
  act: powerfarm.app/act/<sequence>
  type_segment: name-of-the-contract-that-defines-the-type
  stored_without_scheme: true
  resolvable_with_https_prefix: true
  lowercase_ascii: true
  never_reused: true
  never_renamed: true
  names_say_what_not_where: true
  provider_identities_are_bindings: true
  first_person_name: chosen-at-foundation-not-in-public-docs

hostnames:
  first_party_only: true
  webauthn_relying_party_id: powerfarm.app
  previews: <service>-preview.powerfarm.app
  services:
    - host: powerfarm.app
      role: front-door-and-name-resolver
      entity: powerfarm.app/service/registry
      stage: v0
    - host: id.powerfarm.app
      role: identity-login-oauth-issuer
      entity: powerfarm.app/service/identity
      stage: v0
    - host: api.powerfarm.app
      role: institutional-api
      entity: powerfarm.app/service/api
      stage: v0
    - host: vault.powerfarm.app
      role: minivault-web-projection
      entity: powerfarm.app/app/minivault-web
      stage: v0
    - host: places.powerfarm.app
      role: coloured-places
      entity: powerfarm.app/app/coloured-places
      stage: v0
    - host: mcp.powerfarm.app
      role: mcp-door
      entity: powerfarm.app/service/mcp
      stage: later-closed-until-the-identity-provider-supports-audience-bound-tokens
    - host: search.powerfarm.app
      role: search
      entity: powerfarm.app/service/search
      stage: later

registry:
  basics:
    entities: things-that-act
    objects: things-that-are-acted-on
    versions: exact-bytes-of-an-object
    contracts: every-recognized-definition-and-relationship
  entity_or_object: entities-act-objects-are-acted-on
  type_roots:
    - powerfarm.app/contract/contract-type
    - powerfarm.app/contract/entity-type
    - powerfarm.app/contract/object-type
    - powerfarm.app/contract/action-type
  contract_type_declares_participants: true
  may: type-rights + powers-of-contracts-naming-it-as-subject + powers-of-contracts-it-holds
  holders_receive_powers_only_by_holding: true
  agent_for_person: intersection
  authority_never_widens: true

bootstrap:
  first_two_contracts:
    - name: powerfarm.app/contract/contract-type
      type: self
    - name: powerfarm.app/contract/entity-type
      type: powerfarm.app/contract/contract-type
  contract_types:
    roots:
      - object-type
      - action-type
    recognized_in_the_story:
      - office
      - mandate
      - permission
      - app-contract
      - engine-capability
      - store-authority
      - search-contract
      - machine-placement
      - secret-consumer
      - execution-approval
      - backup-custody
  entity_types:
    person: powerfarm.app/person/*
    agent: powerfarm.app/agent/*
    app: powerfarm.app/app/*
    service: powerfarm.app/service/*
    host-runner: powerfarm.app/host-runner/*
    engine: powerfarm.app/engine/*
    mcp: powerfarm.app/mcp/*
  object_types:
    without_versions:
      sector: powerfarm.app/sector/*
      machine: powerfarm.app/machine/*
      process: powerfarm.app/process/*
      store: powerfarm.app/store/*
      repository: powerfarm.app/repository/*
      secret: powerfarm.app/secret/*
      search-source: powerfarm.app/search-source/*
      projection: powerfarm.app/projection/*
    with_versions:
      institutional:
        - document
        - software
        - schema
        - dataset
        - prompt
        - capability
        - execution-bundle
        - migration-evidence
      minivault_kinds:
        - program
        - component
        - knowledge
        - idea
        - decision
        - trajectory
        - unknown
  action_types:
    view: OBSERVE
    read-content: OBSERVE
    converse: PROPOSE
    propose: PROPOSE
    write-observation: PERSIST
    store-content: PERSIST
    inscribe: PERSIST
    publish: PERSIST
    approve: AUTHORIZE
    release: AUTHORIZE
    admit-person: AUTHORIZE
    recognize-contract: AUTHORIZE
    grant: AUTHORIZE

foundation_act:
  act: 1
  runs: once
  precondition: registry-empty
  after: closed-forever
  recognizes:
    - first_two_contracts
    - contract_types.roots
    - contract_type.office
    - contract_type.mandate
    - entity_type.person
    - director_action_types
    - powerfarm.app/contract/director
    - first_person
    - powerfarm.app/contract/mandate.director.first_person
    - admission.first_person
  must_leave_the_founder_holding_authority: true

act_log:
  fields:
    - sequence
    - at
    - actor
    - on_behalf_of
    - action
    - target
    - content_sha256
    - previous_hash
    - hash
  sequence: strictly-increasing
  hash: fixed-field-encoding-computed-by-the-database
  edits: never
  roles:
    - audit
    - event-stream
    - the-story

rebuild:
  specification: v0/V0-03_REBUILD.md
  repository: powerfarm/minivault
  story: story/
  script: tools/rebuild
  replays: act-log-over-content-store
  chapters:
    - identity
    - registry
    - minivault
    - research
  step_fields:
    - says
    - needs
    - check
    - do
    - verify
    - receipt
  director_only:
    - provider-access-token
    - sign-up-at-foundation
    - issue-secret-values
    - drop-earlier-state
    - offline-signing-key
  secrets: issued-again-never-restored
  drill: monthly-and-after-material-change

copies:
  act_log:
    - where: powerfarm.app/machine/lab-8gb
      when: nightly
      check: hash-chain-verifies
  content_store:
    - where: powerfarm.app/machine/lab-8gb
      when: at-least-monthly
      check: all-content-re-hashed
    - where: google-drive-powerfarm-backup
      when: snapshot
      check: all-content-re-hashed
    - where: cloudflare-r2
      when: if-cost-stays-negligible
      check: all-content-re-hashed
  identity_substrate_database: provider-backups
  antenna_store: point-in-time-restore-or-declared-loss

required:
  offices:
    - name: powerfarm.app/contract/director
      holders:
        - person
    - name: powerfarm.app/contract/engineer
      holders:
        - agent
      autonomy_matrix:
        rungs:
          - OBSERVE
          - SUGGEST
          - SAFE-AUTO
          - POLICY-AUTO
        per_operation_class: true
        earned_by: precedent-indexed-by-input
        regressible: true
        authority_survives_autonomy: true
        evidence_authored_by_subject: false
        protected_classes_gated_at_every_rung: true
        initial_rung: OBSERVE-or-SUGGEST
        precedent_ledger: agent-runtime-events-in-powerfarm.app/store/antenna

  persons:
    - role: holder-of-powerfarm.app/contract/director
      name: chosen-at-foundation
      mandate: powerfarm.app/contract/mandate.director.<holder>

  agents:
    code: powerfarm/places:apps/agent
    release: merge-to-main
    release_order:
      - powerfarm.app/machine/lab-256
      - powerfarm.app/machine/lab-512
      - powerfarm.app/machine/lab-8gb
    next_lab_moves_only_after_previous_is_healthy: true
    members:
      - name: powerfarm.app/agent/lab-8gb
        place: powerfarm.app/machine/lab-8gb
        role: principal
        required: true
      - name: powerfarm.app/agent/lab-512
        place: powerfarm.app/machine/lab-512
        role: reserve
        required: true
      - name: powerfarm.app/agent/lab-256
        place: powerfarm.app/machine/lab-256
        role: bench
        required: false

  machines:
    - name: powerfarm.app/machine/lab-8gb
      expected_availability: always-on
    - name: powerfarm.app/machine/lab-512
      expected_availability: always-on

  excluded_machines:
    - name: powerfarm.app/machine/lab-256
      reason: the-directors-personal-computer
      may_be_required_for_ecosystem_availability: false

  continuity:
    workflow_engine:
      implementation: google-adk
      role: onboarding-and-workflow-orchestration
      placement: engine-park
    host_runners:
      - name: powerfarm.app/host-runner/lab-8gb
        place: powerfarm.app/machine/lab-8gb
      - name: powerfarm.app/host-runner/lab-512
        place: powerfarm.app/machine/lab-512
    parks:
      app_park:
        admission: contract-required
        required_residents: []
      engine_park:
        admission: contract-required
        required_residents:
          - google-adk
    places:
      name: powerfarm.app/app/coloured-places
      hostname: places.powerfarm.app
      placement: vercel
      vercel_project: powerfarm-places
      code: powerfarm/places:apps/coloured-places
      deploys_on: merge-to-main
      role: projection
    permanent_processes:
      - name: powerfarm.app/process/manhattan
        places:
          - powerfarm.app/machine/lab-8gb
          - powerfarm.app/machine/lab-512
        cleanup_protected: true
    research:
      filesystem_root: ~/POWERFARM/Research
      observability: braintrust
    cloudkit:
      name: powerfarm.app/store/apps
      rebuildable: true
      remote_programmatic_provisioning_required: true
      private_zone_provisioning_requires_user_authenticated_owner: true
      server_to_server_key_private_database_authority: false
      provisioner_placement: always-on-ecosystem-lab
      must_not_depend_on: powerfarm.app/machine/lab-256
      preserve_provider_capability:
        - apple-developer-account-binding
        - container-identity
        - provisioning-and-signing-material
        - required-keys-and-certificates
      container: iCloud.app.powerfarm
      role: contract-provisioned-app-and-engine-databases
      locator_policy: container/environment/database/zone
      registry_authority: false

  identity:
    substrate:
      name: powerfarm.app/store/company
      provider: supabase
      provider_binding:
        project_ref: ekjlmclhqnsstfjzuabz
        project_name: powerfarm.kernal
        region: eu-west-1
        plan: free
      holds:
        - registry
        - identity
        - content-store
        - minivault
        - act-log
        - institutional-api
      schemas:
        - registry
        - identity
        - content
        - acts
        - vault
      tables_deny_all_access_is_through_api_functions: true
    sign_in:
      methods:
        - email-link
        - passkey
      host: id.powerfarm.app
      gates:
        - before-user-created: admission-required
        - custom-access-token: current-contract-required
    content_store:
      name: powerfarm.app/store/content
      within: powerfarm.app/store/company
      substrate: private-storage-bucket
      object_key: sha256-digest
      insert_only: true
      digest_computed_server_side: true
      manifests: true
      digest_is_capability: false
      integrity_sweep: nightly
    minivault:
      repository: powerfarm/minivault
      authority: registry
      item: object-with-versions
      kind: object-type-contract
      revision_id: sha256-of-canonical-bytes
      canonicalization: rfc8785
      publish: recognize-new-version-supersede-current
      undo: new-publication-of-earlier-bytes
      deprecate: reversible-flag
      retire: registry-retirement
      review_when_effects_change: approval-bound-to-digest
      stays_inside:
        - drafts
        - proposals-and-reviews
        - revision-relations
        - derivations
        - subscriptions
      kernel_runs_in: edge-functions
      interface:
        name: powerfarm.app/app/minivault-web
        host: vault.powerfarm.app
        audiences:
          - llm
          - human
        authority: false
    repositories:
      native_semantics_home: identity-minivault
      github_role:
        - source-control
        - collaboration
        - publication
        - projection
      github_defines_native_format: false

  operational:
    antenna_store:
      name: powerfarm.app/store/antenna
      owner: powerfarm.app/service/antenna
      provider: neon
      provisioned_through: vercel-integration
      role: observational-evidence
      writers: agents-own-observations-only
      registry_projection: read-only-refreshed-through-registry-api
      views:
        - existence-by-recognition
        - duties-by-facts
    external_observer:
      lives_in: powerfarm.app/store/company
      alive_mark_every: PT15M
      emails: on-state-change-only
      weekly_still_watching: true
      kept_in_identity_substrate: last-seen-per-agent

  services:
    - name: powerfarm.app/service/antenna
    - name: powerfarm.app/service/heartime
    - name: powerfarm.app/service/search

  search:
    status: deferred
    authority: false
    sources:
      - name: powerfarm.app/search-source/company
        source: powerfarm.app/store/company
      - name: powerfarm.app/search-source/apps
        source: powerfarm.app/store/apps

  references:
    - name: the-book
      provider: supabase
      provider_ref: vbgzdqdlarulpfsyjrke
      provider_name: Google ADK mapping
      kind: acquired-reference-work
      disposition: KEEP
      existence_decided_by_powerfarm: false
      access: read-only
      use_as_backend: false
      ddl_allowed: false

required_contract_families:
  - app-contract
  - engine-capability
  - store-authority
  - search-contract
  - host-runner
  - machine-placement
  - secret-consumer
  - execution-approval
  - backup-custody

secret_references:
  director:
    - powerfarm.app/secret/provider-access-token
    - powerfarm.app/secret/offline-signing-key
  identity:
    - powerfarm.app/secret/supabase
    - powerfarm.app/secret/email-provider
  coloured_places:
    - powerfarm.app/secret/oauth-client-secret
    - powerfarm.app/secret/antenna-store-read
  agents:
    - powerfarm.app/secret/antenna-store-write-per-agent
    - powerfarm.app/secret/chat-signing-key-per-agent
    - powerfarm.app/secret/ai-gateway
  research:
    - powerfarm.app/secret/braintrust
    - powerfarm.app/secret/google
  apple_provisioner:
    - powerfarm.app/secret/apple
  manhattan:
    - powerfarm.app/secret/manhattan-host

to_remove:
  - item: registry-made-without-the-v0-01-design-and-the-frozen-airtable-export
    location: powerfarm.kernal schema powerfarm_registry and its bucket
    disposition: DELETE
    archive: none
    method: renamed-out-of-the-way-by-the-rebuild-script-then-dropped-by-the-director
  - item: temporary-observation-schema
    location: powerfarm.kernal schema powerfarm_observacao
    disposition: DELETE
    archive: none
    after: antenna-store-live
  - item: hostnames-outside-v0-07
    hosts:
      - registry.powerfarm.app
      - app.powerfarm.app
      - portal.powerfarm.app
    disposition: DELETE
  - item: apple-first-registry-test-records
    location: cloudkit
    disposition: DELETE
  - item: earlier-powerfarm-registry-source
    location: lab-8gb
    disposition: KEEP_OUTSIDE_REGISTRY
    migrates: nothing

negative_delta_dispositions:
  - DELETE
  - ARCHIVE_THEN_MOVE
  - KEEP_OUTSIDE_REGISTRY
  - QUARANTINE_OR_DECIDE
  - REPLACE

repository_territories:
  provider: github
  organization: powerfarm
  repositories:
    - .github
    - powerfarm-research-docs
    - powerfarm-specs
    - minivault
    - places
    - powerfarm-identity
    - powerfarm-continuity
    - powerfarm-antenna
    - powerfarm-heartime

decided:
  rebuildable: founding-principle-pf-03-3-3
  names: v0-07
  fingerprint: sha256-only
  minivault_undo: new-publication
  birth: acts-only-never-seed
  earlier_test_state: not-archived-dropped-by-the-director
  repositories: registry-and-minivault-in-minivault; agents-and-places-in-places
  heartbeats: deterministic-never-a-model
  copies: lab-8gb-and-google-drive; cloudflare-r2-if-cheap
  the_book: KEEP
  offices: director-is-the-owner; llm-agents-hold-engineer
  director_powers_v0: all, protected-effects-gated-by-approval
  who_admits_people: director
  registry_in_antenna_store: api-refreshed-projection-not-replication
  mcp_door: closed-until-audience-bound-tokens-and-public-clients

open_decisions:
  - initial-rung-per-engineer-operation-class
  - large-bytes-location
  - executable-graph-exchange-format
  - where-the-workbench-lives
  - sealed-secret-values-in-the-content-store

completion:
  negative_delta: empty-or-explicitly-retained
  positive_delta: empty
  current_registry_equals_this_target: true
  post_convergence_census_matches_topology: true
  rebuild_drill_passes: true
