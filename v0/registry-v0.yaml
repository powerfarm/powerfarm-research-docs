version: powerfarm.registry-v0.working-3
status: proposed
date: 2026-09-26
supersedes: powerfarm.registry-v0.working-2

recognition:
  authority: director_merge
  baseline_pull_request: 5
  baseline_commit: 6438c55a20e82e922322d26561487f91761a6e3a

architecture:
  research:
    id: pf.research
    question: what-we-study
  continuity:
    id: pf.continuity
    question: how-we-do-it
  identity:
    id: pf.identity
    question: who-we-are
    functions:
      - oauth-and-principals
      - registry
      - minivault

principles:
  registry_is_structural_recognition_not_operational_omniscience: true
  operational_state_belongs_to_its_owner: true
  contracts_define_admissible_structure: true
  valuable_results_may_be_promoted_to_minivault: true
  projections_are_not_authority: true
  storage_does_not_define_semantics: true
  provider_identity_does_not_define_institutional_identity: true
  secret_values_in_public_or_projected_state: forbidden
  entities_are_governed_by_contracts: true
  types_come_from_current_contracts: true
  authority_is_computed_from_current_contracts_at_request_time: true
  identity_is_the_entity_login_is_a_binding: true
  migration_creates_no_rows: true
  first_write_is_the_foundation_act: true
  all_writes_through_the_institutional_api: true
  operational_state_outside_the_identity_substrate: true

bootstrap:
  first_two_contracts:
    - name: Contract Type
      type: self
    - name: Entity Type
      type: Contract Type
  contract_types:
    - Artifact Type
    - Action Type
    - Office
    - Mandate
    - app-contract
    - engine-capability
    - store-authority
    - search-contract
    - host-runner
    - machine-placement
    - secret-consumer
    - execution-approval
    - backup-custody
  entity_types:
    person: pf.person.*
    agent: pf.agent.*
    office: pf.office.*
    sector: pf.<sector>
    machine: pf.lab-*
    service: pf.<service>
    host-runner: pf.host-runner.*
    process: pf.process.*
    app: pf.app.*
    engine: pf.engine.*
    mcp: pf.mcp.*
    store: pf.store.*
    repository: pf.repo.*
    secret: pf.secret.*
    search-source: pf.search-source.*
    projection: pf.projection.*
  artifact_types:
    - document
    - software
    - schema
    - dataset
    - prompt
    - capability
    - execution-bundle
    - migration-evidence
  action_types:
    - view
    - converse
    - approve
    - admit-person
    - recognize-contract
    - inscribe-entity
    - grant
    - store-content
    - read-content
    - write-observation
  mandate_prerogative:
    holder_types:
      - person
      - agent

foundation_act:
  runs: once
  precondition: registry-empty
  after: closed-forever
  recognizes:
    - first_two_contracts
    - contract_types
    - entity_type.person
    - entity_type.office
    - director_action_types
    - office.pf.office.director
    - first_person
    - mandate.director.first_person
    - admission.first_person
  first_person_id_and_login: chosen-at-foundation-not-in-public-docs

required:
  offices:
    - id: pf.office.director
      type: office
      eligible_holder_types:
        - person

  persons:
    - role: holder-of-pf.office.director
      id: chosen-at-foundation
      mandate: pf.contract.mandate.director.<holder>

  agents:
    - id: pf.agent.lab-8gb
      place: pf.lab-8gb
      required: true
    - id: pf.agent.lab-512
      place: pf.lab-512
      required: true
    - id: pf.agent.lab-256
      place: pf.lab-256
      required: false

  machines:
    - id: pf.lab-8gb
      kind: machine
      expected_availability: always-on
    - id: pf.lab-512
      kind: machine
      expected_availability: always-on

  excluded_machines:
    - id: pf.lab-256
      reason: director-personal-mobile-computer
      may_be_required_for_ecosystem_availability: false

  continuity:
    workflow_engine:
      implementation: google-adk
      role: onboarding-and-workflow-orchestration
      placement: engine-park
      current_state: positive-delta

    host_runners:
      - id: pf.host-runner.lab-8gb
        place: pf.lab-8gb
      - id: pf.host-runner.lab-512
        place: pf.lab-512

    parks:
      app_park:
        admission: contract-required
        required_residents:
          - pf.app.coloured-places
      engine_park:
        admission: contract-required
        required_residents:
          - google-adk

    permanent_processes:
      - id: pf.process.manhattan
        places:
          - pf.lab-8gb
          - pf.lab-512
        cleanup_protected: true

    research:
      filesystem_root: ~/POWERFARM/Research
      observability: braintrust

    cloudkit:
      id: pf.store.cloudkit.apps
      rebuild_allowed: true
      remote_programmatic_provisioning_required: true
      private_zone_provisioning_requires_user_authenticated_owner: true
      server_to_server_key_private_database_authority: false
      provisioner_placement: always-on-ecosystem-lab
      must_not_depend_on: pf.lab-256
      preserve_provider_capability:
        - apple-developer-account-binding
        - container-identity
        - provisioning-and-signing-material
        - required-keys-and-certificates
      target: iCloud.app.powerfarm
      role: contract-provisioned-app-and-engine-database-substrate
      owner_scope: admitted-apps-and-engines
      locator_policy: container/environment/database/zone
      institutional_registry_authority: false
      forbidden_final_state:
        - legacy-powerfarm-registry-test-records

  identity:
    supabase:
      id: pf.store.supabase.company
      role: identity-substrate
      target: supabase
      provider_binding:
        project_ref: ekjlmclhqnsstfjzuabz
        project_name: powerfarm.kernal
        region: eu-west-1
        observed_state: ACTIVE_HEALTHY
        observed_at: 2026-09-23
      intended_for:
        - oauth-and-principals
        - institutional-registry
        - content-store
        - minivault
        - identity-supporting-state
        - institutional-api

    content_store:
      id: pf.store.content
      substrate: supabase-storage-private-bucket
      within: pf.store.supabase.company
      byte_digest: sha256
      manifests: true
      digest_is_capability: false

    minivault_hashes:
      semantic_identity: blake3
      exact_bytes: sha256


    minivault_interface:
      id: pf.app.minivault-web
      kind: web-app
      audiences:
        - llm
        - human
      authority: false

    repositories:
      native_semantics_home: identity-minivault
      github_role:
        - source-control
        - collaboration
        - publication
        - projection
      github_defines_native_format: false

  operational:
    antenna_store:
      id: pf.store.neon.antenna
      owner: pf.antenna
      provider: neon
      provisioned_through: vercel-integration
      role: observational-evidence
      writers: agents-own-observations-only
      registry_replica: read-only
      views:
        - existence-by-recognition
        - duties-by-facts

  services:
    - id: pf.antenna
      kind: service
    - id: pf.heartime
      kind: service
    - id: pf.search
      kind: service

  search:
    authority: false
    sources:
      - id: pf.search-source.supabase
        source: pf.store.supabase.company
      - id: pf.search-source.cloudkit
        source: pf.store.cloudkit.apps
    human_projection:
      id: pf.projection.airtable
      role: powerfarm-search-frontend
      authoritative: false

  canonical_documents:
    - id: pf.doc.PF-01
      path: PF-01_Powerfarm_Charter.md
    - id: pf.doc.PF-02
      path: PF-02_Research_and_Evidence_Standard.md
    - id: pf.doc.PF-03
      path: PF-03_Powerfarm_Operating_System.md
    - id: pf.doc.PF-04
      path: PF-04_Intelligence_and_Technology_System.md
    - id: pf.doc.PF-05
      path: PF-05_Products_and_Business_System.md
    - id: pf.doc.PF-06
      path: PF-06_Standard_Documents_Catalog.md

  v0_specifications:
    - path: v0/V0-01_DATA_REGISTRY_IDENTITY_AND_STORES.md
    - path: v0/V0-02_APP_PARK_ENGINE_PARK_AND_APP_CONTRACTS.md
    - path: v0/V0-06_POWERFARM_SEARCH.md
    - path: v0/PF-03-PF-04-DECONSTRUCTION.md

required_contract_families:
  - app-contract
  - engine-capability
  - store-authority
  - search-contract
  - host-runner
  - machine-placement
  - secret-consumer
  - execution-approval
  - backup-custody

legacy_sources:
  - id: legacy.supabase.kernal-registry-2026-09-24
    kind: unauthorized-bootstrap
    location: powerfarm.kernal schema powerfarm_registry
    terminal_disposition: ARCHIVE_THEN_DELETE
    archive: full-export-data-and-original-sql
    final_deletion_by: director
    id_mapping:
      pf.person.director: pf.office.director (office) + first person (mandate)
      pf.host-runner.lab-8gb (used by agent): pf.agent.lab-8gb
      pf.host-runner.lab-512 (used by agent): pf.agent.lab-512

  - id: legacy.supabase.kernal-observation-2026-09-26
    kind: test-state
    location: powerfarm.kernal schema powerfarm_observacao
    terminal_disposition: ARCHIVE_THEN_DELETE
    final_deletion_by: director
    replacement: pf.store.neon.antenna

  - id: legacy.airtable.registry-export
    kind: frozen-evidence
    location: minivault bucket
    disposition: first-content-store-object-recognized-after-foundation

  - id: legacy.airtable.registry
    kind: migration-source
    terminal_disposition: DELETE
    after: verified-migration-to-supabase-identity

  - id: legacy.cloudkit.registry-tests
    kind: test-state
    terminal_disposition: DELETE
    after: signed-census-and-director-disposal-decision

  - id: legacy.supabase.powerfarm-registry
    kind: migration-source
    provider_name: powerfarm-registry
    live_provider_project_visible: false
    local_source: ~/lab/powerfarm-registry
    terminal_disposition: REPLACE
    replacement: pf.store.supabase.company
    final_authority: false
    migrate_only:
      - required-identity-and-registry-truth
    do_not_migrate_by-default:
      - runs
      - adk-runtime-state
      - workspace-and-gadget-working-state

  - id: legacy.supabase.google-adk-mapping
    kind: empty-project
    provider_ref: vbgzdqdlarulpfsyjrke
    terminal_disposition: DELETE
    evidence:
      user_tables: 0
      auth_users: 0
      storage_buckets: 0
      user_migrations: 0
      edge_functions: 0
      development_branches: 0

negative_delta_dispositions:
  - DELETE
  - ARCHIVE_THEN_DELETE
  - ARCHIVE_THEN_MOVE
  - KEEP_OUTSIDE_REGISTRY
  - QUARANTINE_OR_DECIDE
  - REPLACE

repository_territories:
  active:
    provider: github
    organization: powerfarm
    meaning: active-v0-source-projection
    repositories:
      - .github
      - powerfarm-research-docs
      - powerfarm-specs
      - powerfarm-identity
      - powerfarm-continuity
      - powerfarm-coloured-places
      - powerfarm-antenna
      - powerfarm-heartime
  historical:
    provider: github
    organization: powercitty
    meaning: superseded-repository-preservation
    transfer_disposition: ARCHIVE_THEN_MOVE
    active_registry_membership_after_transfer: false
    move_from_powerfarm:
      - powerfarm-process-manager
      - powerfarm-platform
      - powerfarm-cli

current_negative_delta:
  lab8_app_park:
    keep_repair:
      - coloured-places
    delete:
      - cockpit
      - work-graph
      - zelador
      - zelador-grid
  lab512_app_park:
    delete:
      - zelador
  lab8_engine_park:
    delete:
      - powerfarm
      - workflow-engine
    add:
      - google-adk
  supabase:
    delete:
      - vbgzdqdlarulpfsyjrke

secret_references:
  coloured_places:
    - supabase-publishable-key
    - oauth-client-id
    - oauth-client-secret
    - antenna-client-token-file
  research:
    - braintrust
    - google
  identity:
    - supabase
  apple_provisioner:
    - apple
  manhattan:
    - MANHATTAN_HOST
  agents:
    - antenna-store-credential-per-agent
    - chat-signing-key-per-agent
    - ai-gateway

unresolved_before_adoption: []

open_decisions:
  - registry-replica-in-antenna-store-vs-api-only
  - login-methods-per-person
  - large-bytes-location
  - director-powers-v0
  - who-admits-people
  - antenna-store-cost
  - off-machine-backup-destination

completion:
  negative_delta: empty_or_explicitly_retained
  positive_delta: empty
  legacy_cloudkit_registry_test_state: deleted
  legacy_airtable_registry_state: deleted
  legacy_supabase_registry_authority: absent
  current_registry_equals_adopted_ideal: true
  post_convergence_census_matches_topology: true
